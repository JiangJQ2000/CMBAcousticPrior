# CMB acoustic prior with CAMB, flat LCDM.
# Run:  cobaya-run SPT3GD1_camb.yaml
theory:
  camb:
    extra_args:
      theta_H0_range: [20, 100]
      # The prior was measured with CosmoRec recombination. If your CAMB build
      # includes CosmoRec, uncomment the next line. With CAMB's default
      # recombination, 100 theta_* shifts by -2.4e-5 (0.1 sigma of the baseline).
      # recombination_model: CosmoRec

likelihood:
  # Gaussian prior on (theta_*, omega_b, omega_bc), with omega_bc = omega_b + omega_c.
  # Data: SPT-3G D1
  cmb_acoustic:
    external: |
      (lambda mean, cov: lambda _self: -0.5 * (lambda d: d @ np.linalg.solve(cov, d))(
          np.array([_self.provider.get_param('thetastar') / 100,
                    _self.provider.get_param('ombh2'),
                    _self.provider.get_param('ombh2') + _self.provider.get_param('omch2')]) - mean))(
        np.array([1.0408712799e-02, 2.2221788736e-02, 1.4527338578e-01]),
        np.array([[4.6171699641e-11, -1.4419929152e-10, -1.7864713588e-08],
                  [-1.4419929152e-10, 4.5909458589e-08, -6.3236492429e-08],
                  [-1.7864713588e-08, -6.3236492429e-08, 2.8087269992e-05]]))
    requires: {thetastar: null, ombh2: null, omch2: null}
  # Add late-time likelihoods here, e.g.
  # bao.desi_dr2.desi_bao_all:

params:
  theta_MC_100:
    prior: {min: 0.5, max: 10}
    ref: {dist: norm, loc: 1.0411, scale: 0.0004}
    proposal: 0.0002
    latex: 100\theta_\mathrm{MC}
    drop: true
  cosmomc_theta:
    value: 'lambda theta_MC_100: 1.e-2*theta_MC_100'
    derived: false
  omegabh2:
    prior: {min: 0.005, max: 0.1}
    ref: {dist: norm, loc: 0.0224, scale: 0.0002}
    proposal: 0.0001
    latex: \Omega_\mathrm{b} h^2
  omegach2:
    prior: {min: 0.001, max: 0.99}
    ref: {dist: norm, loc: 0.1185, scale: 0.002}
    proposal: 0.001
    latex: \Omega_\mathrm{c} h^2
  mnu: 0.06
  H0:
    latex: H_0
  thetastar:
    latex: 100\theta_*
  omegam:
    latex: \Omega_\mathrm{m}
  rdrag:
    latex: r_\mathrm{drag}

sampler:
  mcmc:
    Rminus1_stop: 0.01
    max_tries: .inf

output: chains/SPT3GD1_camb
